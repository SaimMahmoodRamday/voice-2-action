services:
  ollama:
    image: ollama/ollama:latest
    container_name: voice2action-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: voice2action-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - WHISPER_MODEL=medium
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - UPLOAD_DIR=/tmp/uploads
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
